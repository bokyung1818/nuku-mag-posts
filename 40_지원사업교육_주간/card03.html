<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>
/* 지원사업·교육 시리즈 = 화이트+NUKU 블루 라이트 테마.
   공연 소식(다크 테마)과 시리즈가 확실히 구분되고, 표지~마지막 장이 한 덱으로 붙는다.
   캐릭터 Book.png에 파란 표지가 들어 있어 밝은 판에 얹어야 제대로 보이는 것도 이유다. */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1350px;}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:#fff;color:#10192B;
  -webkit-font-smoothing:antialiased;word-break:keep-all;}
.frame{position:relative;width:1080px;height:1350px;overflow:hidden;padding:90px 84px;
  display:flex;flex-direction:column;background:#fff;}
/* 카드 상단 얇은 분류 색 띠 — 다크 판을 안 써도 카드끼리 리듬이 생긴다 */
.frame::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:var(--ac,#0273FF);}
.cov-grid{position:absolute;inset:0;z-index:0;
  background-image:linear-gradient(rgba(2,115,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(2,115,255,.05) 1px,transparent 1px);
  background-size:90px 90px;}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;
  font-size:26px;font-weight:700;letter-spacing:.02em;color:#7B8AA3;}
.top .dot{width:13px;height:13px;border-radius:50%;background:var(--ac,#0273FF);display:inline-block;margin-right:11px;}
.top .num{font-variant-numeric:tabular-nums;}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2;}
.chiprow{display:flex;align-items:center;gap:18px;margin-bottom:38px;}
.chip{display:inline-block;font-size:30px;font-weight:800;color:#fff;
  background:var(--ac,#0273FF);border-radius:12px;padding:12px 24px;letter-spacing:.01em;}
.dday{display:inline-block;font-size:30px;font-weight:800;border-radius:12px;padding:12px 22px;
  background:#EEF3FA;border:1px solid #DCE5F2;color:#5A6B85;font-variant-numeric:tabular-nums;}
.dday.hot{background:#FFEBF0;border-color:#FFC7D5;color:#D81E4A;}
.title{font-weight:800;line-height:1.2;letter-spacing:-.03em;width:100%;color:#0C1524;}
.rows{margin-top:56px;display:flex;flex-direction:column;gap:28px;}
.row{display:flex;gap:24px;align-items:flex-start;}
.row .k{flex:none;width:130px;font-size:30px;font-weight:800;color:var(--ac,#0273FF);}
.row .v{flex:1;font-size:34px;font-weight:600;line-height:1.4;color:#2A3648;}
.bot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;
  font-size:25px;font-weight:700;color:#7B8AA3;padding-top:30px;}
.bot .src{color:#9AA7BC;}
/* 기관 로고 — 밝은 판이라 알약 없이 그대로 얹는다 */
.logo{position:absolute;top:150px;right:84px;z-index:3;display:flex;align-items:center;}
.logo img{height:78px;width:auto;max-width:300px;object-fit:contain;display:block;}
/* 표지 */
.frame.cover{background:linear-gradient(168deg,#FFFFFF 0%,#EAF2FF 68%,#DCEAFF 100%);}
.frame.cover .body{justify-content:flex-end;}
.cov-char{position:absolute;right:56px;top:150px;z-index:1;width:470px;}
.cov-char img{width:100%;display:block;}
.cov-k{display:inline-block;align-self:flex-start;font-size:30px;font-weight:800;color:#0273FF;
  background:rgba(2,115,255,.10);border:1px solid rgba(2,115,255,.22);
  border-radius:999px;padding:12px 26px;margin-bottom:36px;}
.cov-h{font-size:128px;font-weight:800;line-height:1.12;letter-spacing:-.04em;color:#0C1524;}
.cov-sub{font-size:40px;font-weight:600;color:#4A5B75;margin-top:34px;line-height:1.5;}
.cov-cats{margin-top:44px;display:flex;flex-wrap:wrap;gap:14px;}
.cov-cats b{font-size:28px;font-weight:800;color:#2A3648;background:#fff;
  border:1px solid #D8E2F0;border-radius:12px;padding:12px 20px;box-shadow:0 2px 8px rgba(12,21,36,.05);}
.cov-hot{margin-top:38px;display:flex;align-items:center;gap:16px;font-size:32px;font-weight:800;color:#0C1524;}
.cov-hot i{font-style:normal;background:#0273FF;color:#fff;border-radius:10px;padding:8px 16px;font-size:30px;}
.cov-meta{margin-top:52px;display:flex;gap:18px;flex-wrap:wrap;}
.cov-meta span{font-size:30px;font-weight:700;color:#2A3648;background:#fff;border:1px solid #D8E2F0;
  border-radius:999px;padding:13px 26px;}
/* A안(대안) — 공고 카드 스택 */
.cov-stack{position:absolute;left:84px;top:170px;right:84px;height:470px;z-index:1;}
.cov-stack .s{position:absolute;left:0;top:0;width:640px;height:190px;border-radius:26px;
  background:#fff;border:2px solid #DCE5F2;box-shadow:0 18px 44px rgba(12,21,36,.10);
  padding:30px 36px;color:#0C1524;font-weight:800;font-size:32px;}
.cov-stack .s1{transform:rotate(-4deg) translate(210px,0);opacity:.5;}
.cov-stack .s2{transform:rotate(-1.5deg) translate(150px,110px);opacity:.75;}
.cov-stack .s3{transform:rotate(1.5deg) translate(90px,220px);opacity:1;}
.cov-stack .s .dd{display:inline-block;margin-top:18px;font-size:30px;color:#fff;background:#0273FF;
  border-radius:10px;padding:8px 18px;}
.cov-bignum{position:absolute;right:70px;top:150px;z-index:1;font-weight:800;font-size:430px;
  line-height:.82;color:rgba(2,115,255,.12);letter-spacing:-.06em;}
/* 마지막 장 — 브랜드 블루 판으로 표지와 짝을 맞춘다 */
.frame.closing{background:linear-gradient(158deg,#0273FF 0%,#0A5AD8 55%,#0B3F9E 100%);color:#fff;}
.frame.closing::before{background:rgba(255,255,255,.35);}
.frame.closing .top{color:rgba(255,255,255,.82);}
.frame.closing .top .dot{background:#fff;}
.frame.closing .bot{color:rgba(255,255,255,.8);}
.frame.closing .bot .src{color:rgba(255,255,255,.62);}
.cl-cat{position:absolute;right:70px;bottom:64px;z-index:1;width:300px;}
.cl-cat img{width:100%;display:block;}
.cl-h{font-size:80px;font-weight:800;line-height:1.24;letter-spacing:-.03em;color:#fff;}
.cl-sub{font-size:38px;font-weight:600;color:rgba(255,255,255,.86);margin-top:34px;line-height:1.55;}
.cl-handle{font-size:46px;font-weight:800;color:#fff;margin-top:60px;}
.cl-handle .dot{width:18px;height:18px;border-radius:50%;background:#fff;display:inline-block;margin-right:14px;}
/* 안내문은 캐릭터 자리를 침범하지 않게 폭을 묶는다.
   가운뎃점(·)에서 단어가 쪼개지지 않도록 문장 단위로 줄을 넘긴다. */
.cl-fine{font-size:22px;color:rgba(255,255,255,.62);line-height:1.6;margin-top:48px;
  font-weight:600;max-width:600px;}
.cl-fine .nb{white-space:nowrap;}
em{font-style:normal;color:#0273FF;}
.frame.closing em{color:#BFE0FF;}
