<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>:root{--bg:#15171C;--ink:#ECE7DC;--muted:#8C92A0;--soft:#B9BEC8;--line:#2C313C;--card:#1E222B;--cardbd:#2C313C;--accent:#3F95FF;--herobg:#0273FF;--herotext:#FFFFFF;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1350px;}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;word-break:keep-all;line-break:strict;}
.frame{position:relative;width:1080px;height:1350px;overflow:hidden;padding:96px;display:flex;flex-direction:column;}
.frame.hero{background:var(--herobg);color:var(--herotext);}
em{font-style:normal;color:var(--accent);}
u{text-decoration:none;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 30%,transparent) 0);}
.hero em{color:#fff;}
.top{display:flex;justify-content:space-between;align-items:center;font-size:23px;font-weight:600;letter-spacing:.04em;color:var(--muted);}
.hero .top{color:rgba(255,255,255,.8);}
.top .num{font-variant-numeric:tabular-nums;}
.bot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:700;color:var(--muted);}
.bot .h{color:var(--soft);}
.hero .bot,.hero .bot .h{color:rgba(255,255,255,.88);}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:12px;}
.hero .dot{background:#fff;}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;}
.h1{font-weight:800;font-size:80px;line-height:1.22;letter-spacing:-.02em;}
.h2{font-weight:800;font-size:64px;line-height:1.27;letter-spacing:-.02em;}
.sub{font-size:35px;line-height:1.6;color:var(--soft);font-weight:500;margin-top:32px;}
.label{display:inline-block;font-size:25px;font-weight:700;color:var(--accent);letter-spacing:.05em;margin-bottom:30px;}
.hint{font-size:27px;color:var(--muted);font-weight:600;margin-top:40px;}
/* item (numbered question) */
.itemwrap{display:flex;gap:44px;align-items:flex-start;}
.bignum{flex:none;font-size:150px;font-weight:800;color:var(--accent);line-height:.82;letter-spacing:-.05em;}
.qbody{flex:1;}
.qlabel{font-size:23px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin-bottom:16px;}
.qhead{font-size:58px;font-weight:800;line-height:1.24;letter-spacing:-.02em;}
.why{font-size:32px;color:var(--soft);line-height:1.5;margin-top:24px;font-weight:600;}
.points{margin-top:30px;}
.pt{display:flex;gap:16px;font-size:30px;line-height:1.45;color:var(--soft);font-weight:500;margin-bottom:14px;}
.pt b{color:var(--accent);font-weight:800;flex:none;}
/* pair */
.pairwrap{display:flex;flex-direction:column;gap:36px;}
.pbox{border:1px solid var(--cardbd);background:var(--card);border-radius:24px;padding:40px 42px;}
.pbox .pn{font-size:26px;font-weight:800;color:var(--accent);margin-bottom:14px;}
.pbox .ph{font-size:46px;font-weight:800;line-height:1.25;letter-spacing:-.02em;}
.pbox .pl{font-size:30px;color:var(--soft);line-height:1.5;margin-top:16px;font-weight:500;}
/* summary list */
.srow{display:flex;align-items:center;gap:28px;padding:26px 0;border-bottom:1px solid var(--line);}
.srow:last-child{border-bottom:none;}
.snum{flex:none;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;}
.slabel{font-size:37px;font-weight:700;line-height:1.2;}
/* list (numbered, deck-generic) */
.items{margin-top:44px;}
.li{display:flex;align-items:flex-start;gap:26px;margin-bottom:32px;}
.li .n{flex:none;width:58px;height:58px;border-radius:16px;background:var(--card);border:1px solid var(--cardbd);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--accent);}
.li .t{font-size:40px;font-weight:700;line-height:1.34;padding-top:6px;}
/* hero formula */
.formula{display:flex;align-items:center;gap:28px;margin:46px 0 28px;flex-wrap:wrap;}
.formula .f{font-size:76px;font-weight:800;}.formula .x{font-size:52px;opacity:.7;}
.hnote{font-size:31px;font-weight:600;color:rgba(255,255,255,.92);border-top:2px solid rgba(255,255,255,.35);padding-top:26px;}
/* compare */
.cmp{display:flex;gap:26px;margin:8px 0 38px;}
.cmp .col{flex:1;background:var(--card);border:1px solid var(--cardbd);border-radius:24px;padding:38px 34px;}
.cmp .nm{font-size:33px;font-weight:800;margin-bottom:20px;}.cmp p{font-size:30px;line-height:1.5;color:var(--soft);font-weight:500;}
.punch{font-size:44px;font-weight:800;line-height:1.34;}
/* check */
.chk{display:flex;align-items:center;gap:28px;margin-bottom:28px;}
.chk .box{flex:none;width:50px;height:50px;border-radius:12px;border:3px solid var(--accent);}
.chk .t{font-size:39px;font-weight:600;line-height:1.3;}
/* myth / keyword / shift */
.wrong{font-size:86px;font-weight:800;position:relative;display:inline-block;align-self:flex-start;color:var(--soft);}
.wrong:after{content:'';position:absolute;left:-8px;right:-8px;top:52%;height:7px;background:var(--accent);transform:rotate(-4deg);}
.key{font-size:94px;font-weight:800;color:var(--accent);line-height:1.12;margin:16px 0 4px;}
.spot{font-size:184px;font-weight:800;color:var(--accent);line-height:.84;letter-spacing:-.05em;margin:6px 0 10px;}
.hero .spot{color:#fff;}
.spotcap{font-size:33px;color:var(--soft);line-height:1.5;margin-top:26px;font-weight:500;}
.hero .spotcap{color:rgba(255,255,255,.92);}
.shift .blk{font-size:58px;font-weight:800;line-height:1.3;margin-bottom:38px;}
.shift .pun{font-size:58px;font-weight:800;line-height:1.32;border-top:2px solid var(--line);padding-top:36px;}
/* cta */
.ctabox{margin-top:40px;background:var(--accent);border-radius:22px;padding:34px 42px;font-size:40px;font-weight:800;color:#fff;display:inline-block;}
/* ── 이미지 커버 (full) : 사진 전면 + 하단 글자 ───────────────────── */
.frame.imgcover{padding:0;background:#0A0C10;color:#fff;}
.imgcover .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:var(--imgpos,center 30%);}
.imgcover .scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(8,10,14,.60) 0%,rgba(8,10,14,.10) 24%,
                  rgba(8,10,14,.52) 56%,rgba(8,10,14,.93) 100%);}
.imgcover .inner{position:relative;width:100%;height:100%;padding:88px;
  display:flex;flex-direction:column;text-shadow:0 6px 34px rgba(0,0,0,.5);}
.imgcover .cbody{margin-top:auto;}
.imgcover .top{color:rgba(255,255,255,.82);}
.imgcover .h1{color:#fff;}
.imgcover .hint{color:rgba(255,255,255,.92);margin-top:30px;}
.imgcover .bot{margin-top:52px;}
.imgcover .bot,.imgcover .bot .h{color:rgba(255,255,255,.92);}
.imgcover .dot{background:#fff;}
.imgcover em{color:#8CC2FF;}
.imgcover u{background:linear-gradient(transparent 62%,rgba(2,115,255,.62) 0);}
.chip{display:inline-block;align-self:flex-start;font-size:26px;font-weight:800;color:#fff;
  background:var(--accent);border-radius:12px;padding:12px 22px;letter-spacing:.02em;
  margin-bottom:28px;text-shadow:none;}
/* ── 이미지 커버 (split) : 위 사진 / 아래 글자 ────────────────────── */
.frame.splitcover{padding:0;}
.splitcover .ph{position:relative;height:var(--imgh,56%);flex:none;overflow:hidden;}
.splitcover .ph img{width:100%;height:100%;object-fit:cover;object-position:var(--imgpos,center 30%);}
.splitcover .inner{flex:1;padding:66px 88px 84px;display:flex;flex-direction:column;min-height:0;}
.splitcover .cbody{margin-top:36px;}
.splitcover .hint{margin-top:26px;}

/* steps (vertical stepper) */
.steps{margin-top:34px;}
.step{display:flex;gap:30px;position:relative;padding-bottom:42px;}
.step:last-child{padding-bottom:0;}
.step .sc{flex:none;width:66px;height:66px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;z-index:1;}
.step .ln{position:absolute;left:32px;top:60px;bottom:-6px;width:3px;background:var(--cardbd);}
.step:last-child .ln{display:none;}
.step .st{flex:1;padding-top:4px;}
.step .sh{font-size:42px;font-weight:800;line-height:1.22;letter-spacing:-.02em;}
.step .sd{font-size:28px;color:var(--soft);line-height:1.45;margin-top:10px;font-weight:500;}
